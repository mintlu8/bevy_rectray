[package]
name = "bevy_rectray"
version = "0.6.1"
edition = "2021"

authors = ["Mincong Lu <mintlux667@gmail.com>"]
license = "MIT OR Apache-2.0"

readme = "README.md"
repository = "https://github.com/mintlu8/bevy_rectray"
description = """
A minimal 2d layout system for bevy.
"""
keywords = ["bevy", "layout", "ui"]

[features]
default = ["2d", "window", "a11y"]
2d = ["bevy/bevy_sprite"]
window = ["bevy/bevy_window"]
a11y = ["window", "dep:accesskit"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["bevy_picking", "bevy_camera"]}
downcast-rs = "1.2.1"
serde = { version = "1.0.204", features = ["derive"] }
accesskit = { version = "0.24.1", optional = true }

[dev-dependencies]
bevy = "0.19.0"
fastrand = "2.1.0"
itertools = "0.13.0"
